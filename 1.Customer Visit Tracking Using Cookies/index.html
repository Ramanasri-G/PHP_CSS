<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Visit Tracking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>Customer Visit Tracker</h1>
            <p class="subtitle">Welcome! Enter your details to personalize your visit.</p>

            <form action="process.php" method="POST">

                <div class="form-group">
                    <label for="customer_name">Customer Name</label>
                    <input
                        type="text"
                        id="customer_name"
                        name="customer_name"
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="preference">Choose Your Preference</label>
                    <select id="preference" name="preference" required>
                        <option value="">-- Select Preference --</option>
                        <option value="Light">Light Theme</option>
                        <option value="Dark">Dark Theme</option>
                        <option value="Blue">Blue Theme</option>
                    </select>
                </div>

                <button type="submit">Save Preference</button>

            </form>

            <div class="info">
                <p>🍪 Your name and visit information will be stored using cookies.</p>
            </div>
        </div>
    </div>

</body>
</html>
